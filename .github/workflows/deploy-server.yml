name: Deploy to Home Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.SERVER_HOST }}

      - name: Deploy vocaltune through SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 首次建置需安裝並匯出 PyTorch/CUDA/Demucs 大型 image；
          # 預設 SSH command timeout 會在 image exporting 階段提早中止。
          command_timeout: 30m
          script: |
            # Preserve the ADC mount when this host has cloud separation enabled.
            # The shared deploy wrapper uses plain `docker compose`, which reads
            # COMPOSE_FILE for build, restart, recovery and status commands.
            if python3 - <<'PY'
            from pathlib import Path
            path = Path('/home/ricky/deployments/apps/vocaltune/.env')
            enabled = '0'
            if path.is_file():
                for line in path.read_text().splitlines():
                    name, separator, value = line.partition('=')
                    if separator and name.strip() == 'SEPARATION_CLOUD_ENABLED':
                        enabled = value.split('#', 1)[0].strip().strip("\"'")
            raise SystemExit(0 if enabled == '1' else 1)
            PY
            then
              export COMPOSE_FILE='/home/ricky/deployments/apps/vocaltune/docker-compose.yml:/home/ricky/deployments/apps/vocaltune/docker-compose.cloud.yml'
            fi
            /home/ricky/deployments/scripts/deploy-app.sh vocaltune
